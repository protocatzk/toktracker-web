services:
  toktracker-web:
    build: .
    container_name: toktracker-web
    restart: unless-stopped
    # Muss zum Eigentümer des Host-Ordners ./data passen (uid 1001 = restreamer).
    user: "${PUID:-1001}:${PGID:-1001}"
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
